<!DOCTYPE html>
<html>
<head>
    <title>Chez Macro Chef 🐀</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Lobster&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --tomato-red: #E63946;
            --cream-bg: #FFFBF0;
            --zucchini-green: #2A9D8F;
            --eggplant-dark: #1D3557;
            --crust-gold: #F4A261;
        }
        body { background-color: var(--cream-bg); font-family: 'Lato', sans-serif; color: #2c3e50; padding: 40px 0; }
        h1, h2, h3 { font-family: 'Lobster', cursive; color: var(--tomato-red); }
        .card { border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-radius: 20px; background: white; overflow: hidden; }
        .nav-pills .nav-link.active { background-color: var(--tomato-red); color: white; }
        .nav-pills .nav-link { color: var(--eggplant-dark); font-weight: bold; margin: 0 5px; }
        
        .btn-add { background-color: var(--eggplant-dark); color: white; border-radius: 50%; width: 35px; height: 35px; font-weight: bold; padding: 0; line-height: 35px; border: none; }
        .btn-add:hover { background-color: #34495e; color: white; }
        
        .btn-math { background-color: var(--zucchini-green); color: white; font-weight: bold; padding: 12px; border-radius: 10px; border: none; width: 100%; }
        .btn-math:hover { background-color: #21867a; color: white; }
        
        .internal-badge { background-color: var(--eggplant-dark); color: white; font-size: 0.8em; padding: 5px 12px; border-radius: 50px; opacity: 0.8; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container" style="max-width: 800px;">
    
    <div class="text-center mb-5">
        <h1 class="display-4">Chez Macro Chef 🐀</h1>
        <span class="internal-badge">INTERNAL TOOL • SECURE</span>
    </div>

    <ul class="nav nav-pills mb-4 justify-content-center" id="pills-tab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="pills-chef-tab" data-bs-toggle="pill" data-bs-target="#pills-chef" type="button">👨‍🍳 The Chef</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="pills-math-tab" data-bs-toggle="pill" data-bs-target="#pills-math" type="button">📊 The Math</button>
        </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
        
        <div class="tab-pane fade show active" id="pills-chef">
            <div class="card p-5">
                <h3 class="mb-4">What is in the pantry?</h3>
                <form action="/generate-recipe" method="post">
                    <textarea class="form-control mb-3" name="ingredients" rows="3" placeholder="e.g. 500g chicken breast..."></textarea>
                    <button type="submit" class="btn btn-danger w-100 fw-bold">Ask Chef Remy</button>
                </form>
                {% if recipe %} <div class="mt-4 border p-3 rounded"> {{ recipe | safe }} </div> {% endif %}
            </div>
        </div>

        <div class="tab-pane fade" id="pills-math">
            <div class="card p-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 style="color: var(--zucchini-green);">Ingredient Tracker</h3>
                    <button type="button" class="btn-add" onclick="addIngredientRow()">+</button>
                </div>

                <form action="/calculate-macros" method="post">
                    <div id="ingredients-container">
                        <div class="row g-2 mb-2">
                            <div class="col-7">
                                <input type="text" name="names[]" class="form-control" placeholder="Ingredient (e.g. Raw Rice)" required>
                            </div>
                            <div class="col-5">
                                <input type="number" step="any" name="weights[]" class="form-control" placeholder="Grams" required>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="mb-4">
                        <label class="form-label fw-bold">Final Cooked Weight (Total Batch)</label>
                        <input type="number" step="any" name="final_weight" class="form-control" placeholder="e.g. 850 grams" required>
                    </div>

                    <button type="submit" class="btn btn-math">Calculate Ratios</button>
                </form>

                {% if math_result %}
                <div class="mt-4">
                    {{ math_result | safe }}
                </div>
                {% endif %}
            </div>
        </div>

    </div>
</div>

<script>
    function addIngredientRow() {
        const container = document.getElementById('ingredients-container');
        const newRow = document.createElement('div');
        newRow.className = 'row g-2 mb-2';
        newRow.innerHTML = `
            <div class="col-7">
                <input type="text" name="names[]" class="form-control" placeholder="Ingredient Name">
            </div>
            <div class="col-5">
                <input type="number" step="any" name="weights[]" class="form-control" placeholder="Grams">
            </div>
        `;
        container.appendChild(newRow);
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
