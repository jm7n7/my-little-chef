<!DOCTYPE html>
<html>
<head>
    <title>Chez Macro Chef 🐀</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Lobster&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* The Ratatouille Palette */
            --tomato-red: #E63946;
            --cream-bg: #FFFBF0;
            --zucchini-green: #2A9D8F;
            --eggplant-dark: #1D3557;
            --crust-gold: #F4A261;
        }

        body { 
            background-color: var(--cream-bg); 
            font-family: 'Lato', sans-serif;
            color: #2c3e50;
            padding-top: 40px;
            padding-bottom: 40px;
        }

        /* The Bistro Title */
        h1, h2, h3 { font-family: 'Lobster', cursive; color: var(--tomato-red); }
        
        .main-container {
            max-width: 750px;
            margin: auto;
        }

        /* Card Styling - Like a Menu */
        .card { 
            border: none; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            border-radius: 20px; 
            background: white;
            overflow: hidden;
        }

        /* Custom Tabs */
        .nav-pills .nav-link { 
            color: var(--eggplant-dark);
            font-weight: bold;
            border-radius: 10px;
            padding: 10px 20px;
            margin: 0 5px;
        }
        .nav-pills .nav-link.active { 
            background-color: var(--tomato-red); 
            color: white; 
            box-shadow: 0 4px 6px rgba(230, 57, 70, 0.3);
        }

        /* Buttons */
        .btn-chef {
            background-color: var(--tomato-red);
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 10px;
            transition: transform 0.1s;
        }
        .btn-chef:hover { background-color: #d62828; color: white; transform: scale(1.02); }

        .btn-math {
            background-color: var(--zucchini-green);
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 10px;
        }
        .btn-math:hover { background-color: #21867a; color: white; }

        /* Recipe Result Area */
        .recipe-paper {
            background-color: #fff;
            border: 2px dashed var(--crust-gold);
            padding: 25px;
            border-radius: 15px;
            margin-top: 20px;
            position: relative;
        }
        .recipe-paper::before {
            content: "🍽️ Bon Appétit";
            position: absolute;
            top: -12px;
            left: 20px;
            background: white;
            padding: 0 10px;
            color: var(--crust-gold);
            font-weight: bold;
            font-family: 'Lobster', cursive;
        }

        .internal-badge {
            background-color: var(--eggplant-dark);
            color: white;
            font-size: 0.8em;
            padding: 5px 12px;
            border-radius: 50px;
            opacity: 0.8;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container main-container">
    
    <div class="text-center mb-5">
        <h1 class="display-4">Chez Macro Chef 🐀</h1>
        <p class="lead text-muted">Cooking creatively with what you have.</p>
        <span class="internal-badge">INTERNAL TOOL • SECURE</span>
    </div>

    <ul class="nav nav-pills mb-4 justify-content-center" id="pills-tab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="pills-chef-tab" data-bs-toggle="pill" data-bs-target="#pills-chef" type="button">👨‍🍳 The Chef</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="pills-math-tab" data-bs-toggle="pill" data-bs-target="#pills-math" type="button">📊 The Math</button>
        </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
        
        <div class="tab-pane fade show active" id="pills-chef">
            <div class="card p-5">
                <h3 class="mb-4">What is in the pantry?</h3>
                <form action="/generate-recipe" method="post">
                    <div class="mb-4">
                        <textarea class="form-control form-control-lg" name="ingredients" rows="3" placeholder="e.g. 2 eggs, stale bread, half an onion, and some cheddar..." style="background-color: #f8f9fa; border: 2px solid #eee;"></textarea>
                    </div>
                    <button type="submit" class="btn btn-chef w-100">Ask Chef Remy for Ideas</button>
                </form>
                
                {% if recipe %}
                <div class="recipe-paper">
                    {{ recipe | safe }}
                </div>
                {% endif %}
            </div>
        </div>

        <div class="tab-pane fade" id="pills-math">
            <div class="card p-5">
                <h3 class="mb-4" style="color: var(--zucchini-green);">Calorie Density Calc</h3>
                <form action="/calculate-macros" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Raw Calories (Total)</label>
                            <input type="number" step="any" name="raw_cals" class="form-control" placeholder="Total Raw Cals">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Final Weight (g)</label>
                            <input type="number" step="any" name="cooked_weight" class="form-control" placeholder="Cooked Weight">
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-math w-100">Calculate Macros</button>
                    </div>
                </form>

                {% if error %}
                <div class="alert alert-danger mt-3">{{ error }}</div>
                {% endif %}

                {% if math_result %}
                <div class="mt-4">
                    {{ math_result | safe }}
                </div>
                {% endif %}
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
